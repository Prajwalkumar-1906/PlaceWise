version: '3.8'

services:
  placement-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: placement-predictor:latest
    container_name: placement-predictor-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
