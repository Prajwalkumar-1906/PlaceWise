[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-predictor"
version = "0.1.0"
description = "Campus Placement Predictor with Explainability (SHAP) and Fairness Audit (Fairlearn)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ML Engineering Team", email = "engineering@campus-placement.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long handled by formatter
    "B008", # Do not perform function call in argument defaults
    "C408", # Unnecessary dict call (standard Plotly parameter syntax)
    "B905", # zip without explicit strict
    "E402", # Module level import not at top of file
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "notebooks/*",
    "app/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
